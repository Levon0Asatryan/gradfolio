name: Feature request
description: Suggest something Gradfolio's web app should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Gradfolio's scope is set by its feature specification (university coursework). What is planned and in progress is in the [tracker](https://github.com/Levon0Asatryan/gradfolio-api/blob/main/docs/tracker.md), in gradfolio-api.
        A request that maps to a spec feature, or argues why it should be added, is the easiest to act on.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you want. A sketch or screenshot helps.
    validations:
      required: true

  - type: input
    id: spec
    attributes:
      label: Related spec feature or milestone
      placeholder: e.g. §6 Search and Discovery, or M3

  - type: textarea
    id: api
    attributes:
      label: API impact
      description: Data the page would need from gradfolio-api, if you know.
