    get:
      operationId: listMyProjects
      tags:
        - projects
      summary: The caller’s own projects, in every state
      description: "Published, private and draft projects together; `state` narrows. Keyset pagination: pass `nextCursor` back as `cursor` with the same `sort`. Unknown query keys, a cursor for another sort and a `limit` over the maximum are 400."
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            default: newest
            description: newest/oldest by creation, updated by last change, name_* by title. Every order ends in the id, so pages never repeat or skip a row.
            type: string
            enum:
              - newest
              - oldest
              - updated
              - name_asc
              - name_desc
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - academic
              - personal
              - research
              - hackathon
              - course
              - other
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ongoing
              - completed
              - archived
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: technology
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            description: Title or technology contains this text (case-insensitive).
            type: string
        - name: limit
          in: query
          required: false
          schema:
            description: Page size; at most PROJECTS_PAGE_MAX (default 50).
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: cursor
          in: query
          required: false
          schema:
            description: The `nextCursor` of the previous page, with the same `sort`. Anything else is 400.
            type: string
            minLength: 1
            maxLength: 600
        - name: state
          in: query
          required: false
          schema:
            description: "published: public and not a draft; private: not public and not a draft; draft: a draft."
            type: string
            enum:
              - published
