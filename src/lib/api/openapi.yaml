components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable code. Branch on this, never on `message`.
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable; not part of the contract.
        details:
          description: Field-level detail, for VALIDATION_FAILED only.
      required:
        - code
        - message
      additionalProperties: false
    AddExternalMemberRequest:
      type: object
      properties:
        name:
          type: string
        role:
          anyOf:
            - type: string
              nullable: true
              enum:
                - null
            - type: string
      required:
        - name
      additionalProperties: false
      description: "A teammate without an account: a name only. No invitation, no notification."
    Certification:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        issuer:
          type: string
        date:
          type: string
          description: YYYY-MM
          example: 2025-01
        credentialUrl:
          nullable: true
          type: string
      required:
        - id
        - name
        - issuer
        - date
        - credentialUrl
      additionalProperties: false
    Education:
      type: object
      properties:
        id:
          type: string
        institution:
          type: string
        degree:
          type: string
        field:
          type: string
        startYear:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        endYear:
          nullable: true
          description: "null: still studying."
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        description:
          nullable: true
          type: string
        highlights:
          type: array
          items:
            type: string
      required:
        - id
        - institution
        - degree
        - field
        - startYear
        - endYear
        - description
        - highlights
      additionalProperties: false
    Experience:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        organization:
          type: string
        start:
          type: string
          description: YYYY-MM
          example: 2024-06
        end:
          nullable: true
          description: "YYYY-MM; null: present."
          type: string
        summary:
          type: string
        achievements:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - organization
        - start
        - end
        - summary
        - achievements
        - skills
      additionalProperties: false
    InviteMemberRequest:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 36
          description: The account to invite (a public profile).
        role:
          description: Shown on the team list; optional.
          anyOf:
            - type: string
              nullable: true
              enum:
                - null
            - type: string
      required:
        - userId
      additionalProperties: false
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - team_invite
            - team_accepted
            - team_rejected
            - team_left
            - general
        title:
          type: string
          description: English fallback text. Prefer rendering `type` + `params`.
        params:
          nullable: true
          description: "null on a notification written before params existed: show `title`."
          allOf:
            - $ref: "#/components/schemas/NotificationParams"
        read:
          type: boolean
        createdAt:
          type: string
          description: ISO 8601, UTC.
        link:
          nullable: true
          description: "App path computed when read: `/projects/<id>` while the project exists and the reader may open it, else null. Never stored."
          type: string
        invite:
          nullable: true
          description: Only on `team_invite`.
          allOf:
            - $ref: "#/components/schemas/NotificationInvite"
      required:
        - id
        - type
        - title
        - params
        - read
        - createdAt
        - link
        - invite
      additionalProperties: false
    NotificationInvite:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
            - gone
          description: "The reader’s membership now. Offer accept/reject only while `pending`; `gone`: the invitation or the project no longer exists."
      required:
        - status
      additionalProperties: false
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          nullable: true
          description: Pass as `cursor`; null on the last page.
          type: string
      required:
        - items
        - nextCursor
      additionalProperties: false
    NotificationParams:
      type: object
      properties:
        actorId:
          nullable: true
          description: The person who caused it, for a profile link. null when their account is gone or their profile is not visible to the reader.
          type: string
        actorName:
          type: string
        projectId:
          type: string
        projectTitle:
          type: string
        role:
          nullable: true
          type: string
      required:
        - actorId
        - actorName
        - projectId
        - projectTitle
        - role
      additionalProperties: false
      description: Names saved when the notification was written, so it still reads after the project or the person is gone. Render the text from `type` and these.
    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        headline:
          type: string
        bio:
          nullable: true
          type: string
        location:
          nullable: true
          type: string
        avatarUrl:
          nullable: true
          type: string
        verified:
          type: boolean
        contactEmail:
          nullable: true
          type: string
        links:
          $ref: "#/components/schemas/ProfileLinks"
        isOwner:
          type: boolean
          description: The caller is the profile owner.
        isPublic:
          type: boolean
        education:
          type: array
          items:
            $ref: "#/components/schemas/Education"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/Certification"
        skills:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProfileProject"
          description: Own and accepted-team projects, newest first. Others see public, published ones only; the owner also sees their own private and draft ones.
      required:
        - id
        - name
        - headline
        - bio
        - location
        - avatarUrl
        - verified
        - contactEmail
        - links
        - isOwner
        - isPublic
        - education
        - experience
        - certifications
        - skills
        - projects
      additionalProperties: false
    ProfileHeader:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        headline:
          type: string
        bio:
          nullable: true
          description: Plain text. Never HTML.
          type: string
        location:
          nullable: true
          type: string
        avatarUrl:
          nullable: true
          description: An http(s) URL (URL-only until M4).
          type: string
        contactEmail:
          nullable: true
          description: Public contact address the user chose. Not the login email.
          type: string
        isPublic:
          type: boolean
          description: "false: only the owner can read the profile."
        links:
          $ref: "#/components/schemas/ProfileLinks"
      required:
        - id
        - name
        - headline
        - bio
        - location
        - avatarUrl
        - contactEmail
        - isPublic
        - links
      additionalProperties: false
    ProfileLinks:
      type: object
      properties:
        github:
          nullable: true
          type: string
        linkedin:
          nullable: true
          type: string
        twitter:
          nullable: true
          type: string
        website:
          nullable: true
          type: string
      required:
        - github
        - linkedin
        - twitter
        - website
      additionalProperties: false
    ProfileProject:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          nullable: true
          type: string
        category:
