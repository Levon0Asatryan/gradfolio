openapi: 3.0.3
info:
  title: Gradfolio API
  version: 0.1.0
  description: Backend for Gradfolio, a student portfolio platform. Every route except the health checks is under `/v1` and needs an Auth0 access token, except reading a public profile (`GET /v1/users/{id}`). Every failure answers with an `ErrorResponse`.
  license:
    name: MIT
tags:
  - name: health
    description: Liveness and readiness, outside `/v1`
  - name: me
    description: The caller’s own account
  - name: profiles
    description: "Profiles: reading anyone’s, editing your own"
  - name: projects
    description: "Projects: reading anyone’s public ones, managing your own"
  - name: team
    description: "Project teams: invitations, answers, the owner’s view"
  - name: notifications
    description: The caller’s own notifications
paths:
  /healthz:
    get:
      operationId: liveness
      tags:
        - health
      summary: "Liveness: the process is running"
      description: Touches no dependency, so it stays 200 while the database is down.
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /readyz:
    get:
      operationId: readiness
      tags:
        - health
      summary: "Readiness: the process can serve traffic"
      description: Runs `SELECT 1` against MySQL, bounded by HEALTH_TIMEOUT_MS.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  database:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                  - database
                additionalProperties: false
        "503":
          description: "DATABASE_UNAVAILABLE: MySQL is unreachable or too slow"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me:
    get:
      operationId: getMe
      tags:
        - me
      summary: The caller’s own account
      description: The first call after a login creates the account from the access token’s profile claims (name, email, picture); later calls return the same id. `verified` follows the token’s `email_verified`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller’s account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The user id (UUID)
                    example: 0b6f2c1e-…
                  name:
                    type: string
                  email:
                    nullable: true
                    type: string
                  avatarUrl:
                    nullable: true
                    type: string
                  headline:
                    type: string
                  verified:
                    type: boolean
                    description: Email verified with Auth0 (GitHub from M7).
                  isPublic:
                    type: boolean
                  onboarded:
                    type: boolean
                    description: "false: the frontend should offer first-login onboarding."
                  identities:
                    type: array
                    items:
                      type: string
                    description: Login providers linked to the account, e.g. `google-oauth2`.
                required:
                  - id
                  - name
                  - email
                  - avatarUrl
                  - headline
                  - verified
                  - isPublic
                  - onboarded
                  - identities
                additionalProperties: false
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMe
      tags:
        - me
      summary: Delete the caller’s account and all its data
      description: "Removes the profile, every section, skills, projects (with attachments, tags and team rows), integrations and notifications. The caller’s name stays on other people’s projects as a plain team-member name, without a photo or a link to an account. Irreversible. The Auth0 login is not deleted: sign the user out afterwards, because a token that is still valid creates a new, empty account on its next request."
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: the account no longer exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/onboarding/complete:
    post:
      operationId: completeOnboarding
      tags:
        - me
      summary: Finish (or skip) first-login onboarding
      description: "Sets `onboarded` on `GET /v1/me`. Idempotent: a repeat call keeps the first timestamp."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Onboarding is complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboarded:
                    type: boolean
                    enum:
                      - true
                required:
                  - onboarded
                additionalProperties: false
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: the account no longer exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/profile:
    get:
      operationId: getMyProfile
      tags:
        - profiles
      summary: The caller’s editable profile header
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileHeader"
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: the account no longer exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMyProfile
      tags:
        - profiles
      summary: Change profile header fields
      description: "Any non-empty subset of the fields. `null` (or a blank string) clears a nullable field; `links` changes only the keys it names. Unknown keys are rejected, so `verified`, `email` and the like cannot be written. `isPublic: false` hides the profile from everyone but the owner immediately."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                headline:
                  type: string
                bio:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                location:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                avatarUrl:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                contactEmail:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                isPublic:
                  type: boolean
                links:
                  type: object
                  properties:
                    github:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                    linkedin:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                    twitter:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                    website:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: The header after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileHeader"
        "400":
          description: "VALIDATION_FAILED: the body does not fit the schema (see `details`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: the account no longer exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/users/{id}:
    get:
      operationId: getProfile
      tags:
        - profiles
      summary: A profile with its sections
      description: Needs no token when the profile is public; a token, when sent, identifies the owner (`isOwner`). A private profile answers 404 to everyone but its owner, exactly as an unknown id does. A token that is sent but invalid is a 401, not an anonymous read. Never includes birthday, phone, the login email or any token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The user id (UUID)
            example: 0b6f2c1e-…
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: "UNAUTHENTICATED: a token was sent and is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: no such profile, or it is private and the caller is not its owner"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AUTH_UNAVAILABLE or DATABASE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/skills:
    put:
      operationId: replaceSkills
      tags:
        - profiles
      summary: Replace the whole skill list
      description: "One transaction. The order given is the order kept; names are normalized and case-insensitive duplicates collapse, with one spelling per name across the site. Over the per-user cap: 400."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skills:
                  maxItems: 1000
                  type: array
                  items:
                    type: string
                  description: Replaces the list. Case-insensitive duplicates collapse.
              required:
                - skills
              additionalProperties: false
      responses:
        "200":
          description: The canonical list
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      type: string
                required:
                  - skills
                additionalProperties: false
        "400":
          description: "VALIDATION_FAILED: the body does not fit the schema (see `details`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/projects/{id}:
    get:
      operationId: getProject
      tags:
        - projects
      summary: A project with its attachments, tags, technologies and team
      description: Needs no token when the project is public and published; a token, when sent, identifies the owner (`isOwner`), who also reads their private and draft projects. An accepted team member also reads a private project (never a draft). A project the caller may not read answers 404, exactly as an unknown id does. A token that is sent but invalid is a 401, not an anonymous read. `descriptionHtml` is sanitized on write; video attachments carry an `embedUrl` to use in an iframe.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The project id (UUID)
            example: 0b6f2c1e-…
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          description: "UNAUTHENTICATED: a token was sent and is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: no such project, or it is private/draft and the caller is neither its owner nor (private only) an accepted team member"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AUTH_UNAVAILABLE or DATABASE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags:
        - projects
      summary: Change project fields
      description: Any non-empty subset of the create fields; `metadata` changes only the keys it names; `technologies`, `tags`, `links` and `files` are replaced as whole lists. The result is validated as a whole, so cross-field rules hold. Someone else’s project, a deleted one and an unknown id all answer 404. A change that alters nothing is a 200.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The project id (UUID)
            example: 0b6f2c1e-…
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                summary:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                descriptionHtml:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                category:
                  type: string
                  enum:
                    - academic
                    - personal
                    - research
                    - hackathon
                    - course
                    - other
                status:
                  type: string
                  enum:
                    - ongoing
                    - completed
                    - archived
                isPublic:
                  type: boolean
                isDraft:
                  type: boolean
                liveDemoUrl:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                repoUrl:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                heroImageUrl:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                technologies:
                  maxItems: 30
                  type: array
                  items:
                    type: string
                tags:
                  maxItems: 20
                  type: array
                  items:
                    type: string
                links:
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      url:
                        type: string
                    required:
                      - label
                      - url
                    additionalProperties: false
                files:
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      url:
                        type: string
                    required:
                      - label
                      - url
                    additionalProperties: false
                metadata:
                  type: object
                  properties:
                    startDate:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                    endDate:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                    course:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                    professor:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: The project after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: "VALIDATION_FAILED: the body does not fit the schema (see `details`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: no such project of the caller's (someone else's id answers the same)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags:
        - projects
      summary: Delete a project
      description: Removes the project with its attachments, tags, technologies and team rows.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The project id (UUID)
            example: 0b6f2c1e-…
      responses:
        "204":
          description: Deleted
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: no such project of the caller's (someone else's id answers the same)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED: over budget; see the Retry-After header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "AUTH_UNAVAILABLE: Auth0 signing keys unreachable, or DATABASE_UNAVAILABLE: MySQL unreachable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/projects:
    post:
      operationId: createProject
      tags:
        - projects
      summary: Create a project
      description: "Only `title` is required. A new project is public and published unless `isPublic: false` or `isDraft: true`. `descriptionHtml` is sanitized with an allow-list on the way in (the response shows what was kept; the limit is measured after sanitizing). `technologies` and `tags` are normalized, de-duplicated case-insensitively and take the site-wide spelling. Unknown keys (`id`, `userId`, `source`, `repo…`, `aiSummary`) are rejected. Over the per-user cap: 409 `LIMIT_REACHED`."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                summary:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                descriptionHtml:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                category:
                  default: other
                  type: string
                  enum:
                    - academic
                    - personal
                    - research
                    - hackathon
                    - course
                    - other
                status:
                  default: ongoing
                  type: string
                  enum:
                    - ongoing
                    - completed
                    - archived
                isPublic:
                  default: true
                  type: boolean
                isDraft:
                  default: false
                  type: boolean
                liveDemoUrl:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                repoUrl:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                heroImageUrl:
                  anyOf:
                    - type: string
                      nullable: true
                      enum:
                        - null
                    - type: string
                technologies:
                  maxItems: 30
                  type: array
                  items:
                    type: string
                tags:
                  maxItems: 20
                  type: array
                  items:
                    type: string
                links:
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      url:
                        type: string
                    required:
                      - label
                      - url
                    additionalProperties: false
                files:
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      url:
                        type: string
                    required:
                      - label
                      - url
                    additionalProperties: false
                metadata:
                  type: object
                  properties:
                    startDate:
                      default: null
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                    endDate:
                      default: null
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                    course:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                    professor:
                      anyOf:
                        - type: string
                          nullable: true
                          enum:
                            - null
                        - type: string
                  additionalProperties: false
              required:
                - title
              additionalProperties: false
      responses:
        "201":
          description: The new project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: "VALIDATION_FAILED: the body does not fit the schema (see `details`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "UNAUTHENTICATED: no access token, or one that is invalid or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "LIMIT_REACHED: the user holds the maximum number of projects"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
